// gradlew build -Pprotect  →  remapJar + protectedJar
if (project.hasProperty('protect')) {
	tasks.named('remapJar').configure {
		finalizedBy tasks.named('protectedJar')
	}
}

// gradlew encryptString -Ptext="Your secret string"
tasks.register('encryptString', JavaExec) {
	group = 'security'
	description = 'Encrypts a string for use with NativeCrypto.loadString() (gradlew encryptString -Ptext="secret")'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'fun.volon.api.utils.security.StringEncryptor'
	
	if (project.hasProperty('text')) {
		args project.property('text')
	} else {
		args 'Example String'
	}
	
	dependsOn classes
}

jar {
	inputs.property "archivesName", project.base.archivesName
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	doFirst {
		if (!baritoneJar.exists()) {
			throw new GradleException("Missing nested Baritone jar: ${baritoneJar}")
		}
		if (!netherPathfinderJar.exists()) {
			throw new GradleException("Missing nether-pathfinder jar: ${netherPathfinderJar}")
		}
	}

	from {
		configurations.shade.collect { dependency ->
			dependency.isDirectory() ? dependency : zipTree(dependency)
		}
	}

	from(baritoneJar) {
		into "META-INF/jars"
	}

	exclude("META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA")

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
