	buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath 'com.guardsquare:proguard-gradle:7.6.1'
	}
}

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

apply from: 'gradle/generate-proguard-dictionaries.gradle'
apply from: 'gradle/protected-jar-remap.gradle'

version = project.mod_version
group = project.maven_group

configurations {
	shade
}

def baritoneJar = file("libs/baritone-standalone-fabric-1.13.1.jar")
def baritoneApiJar = file("libs/baritone-api-fabric-1.13.1.jar")
def netherPathfinderJar = file("libs/nether-pathfinder-1.4.1.jar")

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	    minecraft "com.mojang:minecraft:${project.minecraft_version}"
	    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		modLocalRuntime files(baritoneJar)
		implementation files(netherPathfinderJar)
		shade files(netherPathfinderJar)
		implementation files("libs/jna-5.15.0.jar")
		shade files("libs/jna-5.15.0.jar")
	    compileOnly 'org.projectlombok:lombok:1.18.44'
	    annotationProcessor 'org.projectlombok:lombok:1.18.44'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

loom {
	accessWidenerPath = file("src/main/resources/volon.accesswidener")
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.register('protectedJar', proguard.gradle.ProGuardTask) {
	group = 'build'
	description = 'Obfuscates remapJar with Arabic/Unicode class names (gradlew protectedJar)'
	dependsOn tasks.named('remapJar'), tasks.named('generateProguardDictionaries')

	def inputJar = tasks.named('remapJar').flatMap { it.archiveFile }
	def outputJar = layout.buildDirectory.file("libs/${project.archives_base_name}-${project.version}-protected.jar")
	def mappingFile = layout.buildDirectory.file("proguard/${project.archives_base_name}-${project.version}-mapping.txt")

	injars inputJar
	outjars outputJar
	printmapping mappingFile

	def javaHome = System.getProperty('java.home')
	def jmodDir = file("${javaHome}/jmods")
	['java.base', 'java.desktop', 'java.logging', 'java.xml', 'java.naming'].each { moduleName ->
		libraryjars "${jmodDir}/${moduleName}.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
	}
	libraryjars sourceSets.main.compileClasspath

	configuration file('proguard-rules.pro')

	doLast {
		File out = outputJar.get().asFile
		String assetsNamespace = readProtectedAssetsNamespace()
		remapProtectedJarContents(out, assetsNamespace)
		println "Protected JAR: ${out}"
		println "Name mapping: ${mappingFile.get().asFile}"
		println "Assets namespace: ${assetsNamespace} (assets/${assetsNamespace}/, was assets/volon/)"
		println "Install the -protected.jar in mods/ (not the plain remapJar output)."
	}
}

tasks.register('obfjar', proguard.gradle.ProGuardTask) {
	group = 'build'
	description = 'Obfuscates remapJar without HWID checker (gradlew obfjar)'
	dependsOn tasks.named('remapJar'), tasks.named('generateProguardDictionaries')

	def inputJar = tasks.named('remapJar').flatMap { it.archiveFile }
	def outputJar = layout.buildDirectory.file("libs/${project.archives_base_name}-${project.version}-obf.jar")
	def mappingFile = layout.buildDirectory.file("proguard/${project.archives_base_name}-${project.version}-obf-mapping.txt")

	injars inputJar
	outjars outputJar
	printmapping mappingFile

	def javaHome = System.getProperty('java.home')
	def jmodDir = file("${javaHome}/jmods")
	['java.base', 'java.desktop', 'java.logging', 'java.xml', 'java.naming'].each { moduleName ->
		libraryjars "${jmodDir}/${moduleName}.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
	}
	libraryjars sourceSets.main.compileClasspath

	configuration file('proguard-rules-nohwid.pro')

	doLast {
		File out = outputJar.get().asFile
		String assetsNamespace = readProtectedAssetsNamespace()
		remapProtectedJarContents(out, assetsNamespace)
		println "Obfuscated JAR: ${out}"
		println "Name mapping: ${mappingFile.get().asFile}"
		println "Assets namespace: ${assetsNamespace} (assets/${assetsNamespace}/, was assets/volon/)"
		println "Install the -obf.jar in mods/ (not the plain remapJar output)."
		println "NOTE: This build does NOT include HWID checker."
	}
}

tasks.register('enhancedJar', proguard.gradle.ProGuardTask) {
	group = 'build'
	description = 'Creates ENHANCED obfuscated JAR with crypto protection and aggressive remapping (gradlew enhancedJar)'
	dependsOn tasks.named('remapJar'), tasks.named('generateProguardDictionaries')

	def inputJar = tasks.named('remapJar').flatMap { it.archiveFile }
	def outputJar = layout.buildDirectory.file("libs/${project.archives_base_name}-${project.version}-enhanced.jar")
	def mappingFile = layout.buildDirectory.file("proguard/${project.archives_base_name}-${project.version}-enhanced-mapping.txt")

	injars inputJar
	outjars outputJar
	printmapping mappingFile

	def javaHome = System.getProperty('java.home')
	def jmodDir = file("${javaHome}/jmods")
	['java.base', 'java.desktop', 'java.logging', 'java.xml', 'java.naming', 'java.sql', 'jdk.crypto.cryptoki'].each { moduleName ->
		libraryjars "${jmodDir}/${moduleName}.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
	}
	libraryjars sourceSets.main.compileClasspath

	configuration file('proguard-rules-enhanced.pro')

	doLast {
		File out = outputJar.get().asFile
		String assetsNamespace = readProtectedAssetsNamespace()
		
		// Enhanced post-processing
		remapProtectedJarContents(out, assetsNamespace)
		addAntiTamperChecks(out)
		obfuscateResourceNames(out)
		
		println "═══════════════════════════════════════════════"
		println "ENHANCED PROTECTED JAR CREATED"
		println "═══════════════════════════════════════════════"
		println "Output: ${out}"
		println "Mapping: ${mappingFile.get().asFile}"
		println "Assets: ${assetsNamespace} (remapped from volon)"
		println ""
		println "Protection Features:"
		println "  ✓ Aggressive class/method obfuscation (Arabic/Unicode)"
		println "  ✓ String encryption (runtime decryption)"
		println "  ✓ Anti-tampering checksums"
		println "  ✓ Resource name obfuscation"
		println "  ✓ Control flow obfuscation (5 passes)"
		println "  ✓ Debug info removal"
		println "  ✓ No HWID checker (public release)"
		println ""
		println "Install: Place -enhanced.jar in mods/ folder"
		println "═══════════════════════════════════════════════"
	}
}

