# Разблокировка запуска клиента, если :downloadAssets падает с
# "DownloadException: Failed to download" / SSLHandshakeException (CDN Mojang недоступен).
# Раскомментируй строку, которая нужна, и перезапусти задачу.
# Требование к милору: раскладка <base><первые 2 символа sha1>/<sha1>, слэш на конце обязателен.
# Значения ниже сверены с рабочими проектами, использующими Loom (SolidBlock-cn, Dainsleif233).
# Дефолты, которые подменяются:
#   loom_resources_base    = https://resources.download.minecraft.net/   (именно этот хост чаще всего рвут)
#   loom_version_manifests = https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
#   loom_libraries_base    = https://libraries.minecraft.net/
# loom_resources_base=https://bmclapi2.bangbang93.com/assets/
# loom_resources_base=https://download.mcbbs.net/assets/
# loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
