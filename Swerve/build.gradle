plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
}

loom {
	mods {
		"swerve" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

def patPatJar = file("../PatPat-1.3.1+1.21.4+fabric.jar")
def patPatLicense = file("../PatPat/LICENSE_PatPat")

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}

	// Bundle the unmodified upstream mod as a Fabric nested mod. Its full readable
	// source snapshot and LGPL-3.0-only license are kept in ../DeobfPatPat.
	inputs.file(patPatJar)
	inputs.file(patPatLicense)
	from(patPatJar) {
		into("META-INF/jars")
	}
	from(patPatLicense) {
		into("META-INF/licenses/PatPat")
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
