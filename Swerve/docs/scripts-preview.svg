  <!-- стек скрипта -->
  <g>
    <!-- шляпа -->
    <path d="M330 196 L330 176 Q330 160 348 160 L560 160 Q576 160 576 176 L576 196 Z" fill="#FFBF00"/>
    <text x="344" y="186" fill="#ffffff" font-size="14" font-weight="700">когда функция вызвана</text>

    <!-- уведомление -->
    <rect x="330" y="196" width="392" height="36" rx="6" fill="#4C97FF"/>
    <text x="344" y="220" fill="#ffffff" font-size="14" font-weight="700">уведомление</text>
    <rect x="452" y="202" width="252" height="24" rx="12" fill="#ffffff"/>
    <text x="464" y="219" fill="#575E75" font-size="13" font-weight="700">Привет! Это скрипт Swerve</text>

    <!-- цикл -->
    <path d="M330 232 L330 396 L722 396 L722 232 Z" fill="#FFAB19"/>
    <rect x="330" y="232" width="392" height="36" rx="6" fill="#FFAB19"/>
    <text x="344" y="256" fill="#ffffff" font-size="14" font-weight="700">повторить</text>
    <rect x="424" y="238" width="42" height="24" rx="12" fill="#ffffff"/>
    <text x="445" y="255" fill="#575E75" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="478" y="256" fill="#ffffff" font-size="14" font-weight="700">раз</text>
    <rect x="330" y="386" width="392" height="10" rx="4" fill="#E89A17"/>

    <rect x="354" y="280" width="344" height="36" rx="6" fill="#4C97FF"/>
    <text x="368" y="304" fill="#ffffff" font-size="14" font-weight="700">переключить модуль</text>
    <rect x="530" y="286" width="152" height="24" rx="12" fill="#ffffff"/>
    <text x="542" y="303" fill="#575E75" font-size="13" font-weight="700">KillAura</text>
    <path d="M666 296 l6 6 l6 -6" stroke="#7C829A" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- ожидание -->
    <rect x="330" y="396" width="300" height="36" rx="6" fill="#FFAB19"/>
    <text x="344" y="420" fill="#ffffff" font-size="14" font-weight="700">ждать</text>
    <rect x="396" y="402" width="46" height="24" rx="12" fill="#ffffff"/>
    <text x="419" y="419" fill="#575E75" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="452" y="420" fill="#ffffff" font-size="14" font-weight="700">сек</text>

    <!-- условие -->
    <path d="M330 432 L330 566 L722 566 L722 432 Z" fill="#FFAB19"/>
    <rect x="330" y="432" width="392" height="36" rx="6" fill="#FFAB19"/>
    <text x="344" y="456" fill="#ffffff" font-size="14" font-weight="700">если здоровье &lt;</text>
    <rect x="472" y="438" width="46" height="24" rx="12" fill="#ffffff"/>
    <text x="495" y="455" fill="#575E75" font-size="13" font-weight="700" text-anchor="middle">10</text>
    <rect x="330" y="556" width="392" height="10" rx="4" fill="#E89A17"/>

    <rect x="354" y="480" width="252" height="36" rx="6" fill="#FF8C1A"/>
    <text x="368" y="504" fill="#ffffff" font-size="14" font-weight="700">задать</text>
    <rect x="426" y="486" width="40" height="24" rx="12" fill="#ffffff"/>
    <text x="446" y="503" fill="#575E75" font-size="13" font-weight="700" text-anchor="middle">x</text>
    <text x="474" y="504" fill="#ffffff" font-size="14" font-weight="700">=</text>
    <rect x="494" y="486" width="40" height="24" rx="12" fill="#ffffff"/>
    <text x="514" y="503" fill="#575E75" font-size="13" font-weight="700" text-anchor="middle">0</text>

    <!-- вызов -->
    <rect x="330" y="566" width="234" height="36" rx="6" fill="#FF6680"/>
    <text x="344" y="590" fill="#ffffff" font-size="14" font-weight="700">вызвать</text>
    <rect x="408" y="572" width="140" height="24" rx="12" fill="#ffffff"/>
    <text x="420" y="589" fill="#575E75" font-size="13" font-weight="700">Авто-еда</text>

    <!-- индикатор вставки -->
    <rect x="330" y="602" width="392" height="6" rx="3" fill="#855CD6"/>
  </g>

  <!-- подсказка -->
  <rect x="296" y="690" width="880" height="24" fill="#F1F1F1"/>
  <text x="310" y="706" fill="#9AA0B0" font-size="10">ЛКМ — перетаскивать блоки  ·  ПКМ — удалить  ·  колесо — прокрутка  ·  имя функции — клик по полю  ·  Esc — закрыть</text>
</svg>
