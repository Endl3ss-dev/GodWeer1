<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="Segoe UI, Arial, sans-serif">
  <title>Swerve · редактор скриптов (макет раскладки, как в Scratch)</title>
  <rect width="1200" height="740" fill="#1b1b22"/>

  <!-- окно -->
  <rect x="24" y="24" width="1152" height="690" fill="#F9F9F9"/>
  <rect x="24" y="24" width="1152" height="690" fill="none" stroke="#00000055"/>

  <!-- заголовок -->
  <rect x="24" y="24" width="1152" height="48" fill="#855CD6"/>
  <text x="48" y="55" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="0.5">SWERVE</text>
  <text x="146" y="55" fill="#ffffffcc" font-size="14">· скрипты как в Scratch</text>
  <circle cx="1146" cy="48" r="13" fill="#ffffff33"/>
  <path d="M1141 43 L1151 53 M1151 43 L1141 53" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- панель функций -->
  <rect x="24" y="72" width="272" height="642" fill="#F1F1F1"/>
  <line x1="296" y1="72" x2="296" y2="714" stroke="#D9D9D9"/>
  <text x="38" y="100" fill="#9AA0B0" font-size="11" font-weight="700">ФУНКЦИИ</text>

  <rect x="38" y="110" width="244" height="26" fill="#ffffff" stroke="#00000018"/>
  <rect x="38" y="115" width="3" height="16" fill="#855CD6"/>
  <circle cx="53" cy="123" r="3" fill="#B9BECB"/>
  <text x="64" y="128" fill="#2E3142" font-size="13" font-weight="600">Пример</text>
  <rect x="238" y="115" width="26" height="16" rx="5" fill="#E7E7EC"/>
  <text x="245" y="127" fill="#575E75" font-size="10" font-weight="700">R</text>

  <rect x="38" y="140" width="244" height="26" fill="none"/>
  <circle cx="53" cy="153" r="3" fill="#FFBF00"/>
  <text x="64" y="158" fill="#575E75" font-size="13" font-weight="600">Авто-еда</text>
  <circle cx="268" cy="153" r="3" fill="#4CBF56"/>

  <rect x="38" y="176" width="118" height="24" rx="6" fill="#E7E7EC"/>
  <text x="97" y="193" fill="#575E75" font-size="11" font-weight="600" text-anchor="middle">+ функция</text>
  <rect x="162" y="176" width="120" height="24" rx="6" fill="#E7E7EC"/>
  <text x="222" y="193" fill="#C24B4B" font-size="11" font-weight="600" text-anchor="middle">удалить</text>

  <text x="38" y="229" fill="#9AA0B0" font-size="11" font-weight="700">БЛОКИ</text>
  <g font-size="12" font-weight="600">
    <rect x="38" y="238" width="244" height="22" fill="#ffffff" stroke="#00000014"/>
    <circle cx="49" cy="249" r="5" fill="#FFBF00"/><text x="60" y="254" fill="#2E3142">События</text>
    <circle cx="49" cy="277" r="5" fill="#FFAB19"/><text x="60" y="282" fill="#575E75">Управление</text>
    <circle cx="49" cy="305" r="5" fill="#4C97FF"/><text x="60" y="310" fill="#575E75">Действия</text>
    <circle cx="49" cy="333" r="5" fill="#FF8C1A"/><text x="60" y="338" fill="#575E75">Переменные</text>
    <circle cx="49" cy="361" r="5" fill="#FF6680"/><text x="60" y="366" fill="#575E75">Мои блоки</text>
  </g>

  <!-- палитра -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <rect x="32" y="384" width="256" height="30" rx="8" fill="#FFBF00"/>
    <text x="44" y="404">когда функция вызвана</text>
    <rect x="32" y="420" width="256" height="30" rx="8" fill="#FFBF00"/>
    <text x="44" y="440">каждый тик</text>
    <rect x="32" y="456" width="256" height="30" rx="8" fill="#FFBF00"/>
    <text x="44" y="476">когда заходишь в мир</text>
    <rect x="32" y="498" width="256" height="30" rx="8" fill="#4C97FF"/>
    <text x="44" y="518">переключить модуль</text>
    <rect x="176" y="500" width="100" height="22" rx="11" fill="#ffffff"/>
    <text x="188" y="516" fill="#575E75" font-size="12">модуль</text>
    <text x="46" y="548" fill="#575E75" font-size="10" font-weight="400">Макет раскладки. В игре блоки</text>
    <text x="46" y="562" fill="#575E75" font-size="10" font-weight="400">перетаскиваются мышью.</text>
  </g>

  <!-- тулбар -->
  <rect x="296" y="72" width="880" height="56" fill="#F9F9F9"/>
  <line x1="296" y1="128" x2="1176" y2="128" stroke="#D9D9D9"/>
  <rect x="310" y="86" width="240" height="28" rx="6" fill="#ffffff" stroke="#00000018"/>
  <text x="320" y="105" fill="#2E3142" font-size="13" font-weight="600">Пример</text>
  <rect x="558" y="86" width="132" height="28" rx="6" fill="#ffffff" stroke="#00000018"/>
  <text x="568" y="105" fill="#575E75" font-size="12" font-weight="600">клавиша: R</text>
  <rect x="1030" y="86" width="126" height="28" rx="6" fill="#4CBF56"/>
  <text x="1093" y="105" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">▶  Запустить</text>
  <text x="310" y="122" fill="#9AA0B0" font-size="10">Триггер: вручную</text>

  <!-- полотно -->
  <rect x="296" y="128" width="880" height="562" fill="#ffffff"/>
  <g fill="#E8E8E8">
    <g id="dots">
      <circle cx="328" cy="160" r="1.5"/><circle cx="368" cy="160" r="1.5"/><circle cx="408" cy="160" r="1.5"/><circle cx="448" cy="160" r="1.5"/><circle cx="488" cy="160" r="1.5"/><circle cx="528" cy="160" r="1.5"/><circle cx="568" cy="160" r="1.5"/><circle cx="608" cy="160" r="1.5"/><circle cx="648" cy="160" r="1.5"/><circle cx="688" cy="160" r="1.5"/><circle cx="728" cy="160" r="1.5"/><circle cx="768" cy="160" r="1.5"/><circle cx="808" cy="160" r="1.5"/><circle cx="848" cy="160" r="1.5"/><circle cx="888" cy="160" r="1.5"/><circle cx="928" cy="160" r="1.5"/><circle cx="968" cy="160" r="1.5"/><circle cx="1008" cy="160" r="1.5"/><circle cx="1048" cy="160" r="1.5"/><circle cx="1088" cy="160" r="1.5"/><circle cx="1128" cy="160" r="1.5"/><circle cx="1168" cy="160" r="1.5"/>
      <circle cx="328" cy="200" r="1.5"/><circle cx="368" cy="200" r="1.5"/><circle cx="408" cy="200" r="1.5"/><circle cx="448" cy="200" r="1.5"/><circle cx="488" cy="200" r="1.5"/><circle cx="528" cy="200" r="1.5"/><circle cx="568" cy="200" r="1.5"/><circle cx="608" cy="200" r="1.5"/><circle cx="648" cy="200" r="1.5"/><circle cx="688" cy="200" r="1.5"/><circle cx="728" cy="200" r="1.5"/><circle cx="768" cy="200" r="1.5"/><circle cx="808" cy="200" r="1.5"/><circle cx="848" cy="200" r="1.5"/><circle cx="888" cy="200" r="1.5"/><circle cx="928" cy="200" r="1.5"/><circle cx="968" cy="200" r="1.5"/><circle cx="1008" cy="200" r="1.5"/><circle cx="1048" cy="200" r="1.5"/><circle cx="1088" cy="200" r="1.5"/><circle cx="1128" cy="200" r="1.5"/><circle cx="1168" cy="200" r="1.5"/>
      <circle cx="328" cy="240" r="1.5"/><circle cx="368" cy="240" r="1.5"/><circle cx="408" cy="240" r="1.5"/><circle cx="448" cy="240" r="1.5"/><circle cx="488" cy="240" r="1.5"/><circle cx="528" cy="240" r="1.5"/><circle cx="568" cy="240" r="1.5"/><circle cx="608" cy="240" r="1.5"/><circle cx="648" cy="240" r="1.5"/><circle cx="688" cy="240" r="1.5"/><circle cx="728" cy="240" r="1.5"/><circle cx="768" cy="240" r="1.5"/><circle cx="808" cy="240" r="1.5"/><circle cx="848" cy="240" r="1.5"/><circle cx="888" cy="240" r="1.5"/><circle cx="928" cy="240" r="1.5"/><circle cx="968" cy="240" r="1.5"/><circle cx="1008" cy="240" r="1.5"/><circle cx="1048" cy="240" r="1.5"/><circle cx="1088" cy="240" r="1.5"/><circle cx="1128" cy="240" r="1.5"/><circle cx="1168" cy="240" r="1.5"/>
      <circle cx="328" cy="280" r="1.5"/><circle cx="368" cy="280" r="1.5"/><circle cx="408" cy="280" r="1.5"/><circle cx="448" cy="280" r="1.5"/><circle cx="488" cy="280" r="1.5"/><circle cx="528" cy="280" r="1.5"/><circle cx="568" cy="280" r="1.5"/><circle cx="608" cy="280" r="1.5"/><circle cx="648" cy="280" r="1.5"/><circle cx="688" cy="280" r="1.5"/><circle cx="728" cy="280" r="1.5"/><circle cx="768" cy="280" r="1.5"/><circle cx="808" cy="280" r="1.5"/><circle cx="848" cy="280" r="1.5"/><circle cx="888" cy="280" r="1.5"/><circle cx="928" cy="280" r="1.5"/><circle cx="968" cy="280" r="1.5"/><circle cx="1008" cy="280" r="1.5"/><circle cx="1048" cy="280" r="1.5"/><circle cx="1088" cy="280" r="1.5"/><circle cx="1128" cy="280" r="1.5"/><circle cx="1168" cy="280" r="1.5"/>
      <circle cx="328" cy="320" r="1.5"/><circle cx="368" cy="320" r="1.5"/><circle cx="408" cy="320" r="1.5"/><circle cx="448" cy="320" r="1.5"/><circle cx="488" cy="320" r="1.5"/><circle cx="528" cy="320" r="1.5"/><circle cx="568" cy="320" r="1.5"/><circle cx="608" cy="320" r="1.5"/><circle cx="648" cy="320" r="1.5"/><circle cx="688" cy="320" r="1.5"/><circle cx="728" cy="320" r="1.5"/><circle cx="768" cy="320" r="1.5"/><circle cx="808" cy="320" r="1.5"/><circle cx="848" cy="320" r="1.5"/><circle cx="888" cy="320" r="1.5"/><circle cx="928" cy="320" r="1.5"/><circle cx="968" cy="320" r="1.5"/><circle cx="1008" cy="320" r="1.5"/><circle cx="1048" cy="320" r="1.5"/><circle cx="1088" cy="320" r="1.5"/><circle cx="1128" cy="320" r="1.5"/><circle cx="1168" cy="320" r="1.5"/>
