plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.3'
}

group = 'net.skycore'
version = '1.0.0-recovered'
base { archivesName = 'skycore-client' }

repositories { mavenCentral() }

// Библиотеки для компиляции. Папка libs в репозитории не хранится, поэтому если
// jar-а там нет, берём тот же файл из ресурсов мода: они уже лежат в
// src/main/resources/META-INF/jars и упаковываются в сборку (fabric.mod.json).
// Так чистая копия репозитория собирается без ручной подготовки libs.
def bundledJars = ['jsvg-2.1.0.jar', 'CreativeCore_FABRIC_v2.14.16_mc26.2.jar',
                   'ItemPhysic_FABRIC_v1.8.15_mc26.2.jar'].collect { name ->
    def local = file("libs/$name")
    if (local.exists()) {
        return local
    }
    def bundled = file("src/main/resources/META-INF/jars/$name")
    if (!bundled.exists()) {
        throw new GradleException("Нет библиотеки $name ни в libs, ни в src/main/resources/META-INF/jars")
    }
    return bundled
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'io.github.llamalad7:mixinextras-fabric:0.5.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.156.0+26.2'
    implementation files(bundledJars)
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

loom {
    runs {
        client {
            client()
            runDir 'run'
            programArgs '--username', 'goonglang'
            vmArgs '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
        }
    }
}
