plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.3'
}

group = 'net.skycore'
version = '1.0.0-offline-recovery'
base { archivesName = 'skycore-offline' }

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'io.github.llamalad7:mixinextras-fabric:0.5.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.156.0+26.2'
    implementation files('libs/jsvg-2.1.0.jar', 'libs/CreativeCore_FABRIC_v2.14.16_mc26.2.jar', 'libs/ItemPhysic_FABRIC_v1.8.15_mc26.2.jar')
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Headless smoke tests. Rotation tests use the mapped game math/input types, not a running client.
sourceSets {
    auraTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('testAuraClicks', JavaExec) {
    dependsOn 'auraTestClasses'
    classpath = sourceSets.auraTest.runtimeClasspath
    mainClass = 'net.skycore.client.module.combat.AuraClickEffectsTest'
}
tasks.register('testRockstarAura', JavaExec) {
    dependsOn 'auraTestClasses'
    classpath = sourceSets.auraTest.runtimeClasspath
    mainClass = 'net.skycore.client.module.combat.RockstarAuraTest'
}
tasks.register('testScaffold', JavaExec) {
    dependsOn 'auraTestClasses'
    classpath = sourceSets.auraTest.runtimeClasspath
    mainClass = 'net.skycore.client.module.movement.ScaffoldModuleTest'
}
tasks.register('testSlabPass', JavaExec) {
    dependsOn 'auraTestClasses'
    classpath = sourceSets.auraTest.runtimeClasspath
    mainClass = 'net.skycore.client.module.movement.SlabPassModuleTest'
}
tasks.register('testFreezeClip', JavaExec) {
    dependsOn 'auraTestClasses'
    classpath = sourceSets.auraTest.runtimeClasspath
    mainClass = 'net.skycore.client.module.movement.FreezeClipModuleTest'
}
tasks.register('testTestBridge', JavaExec) {
    dependsOn 'auraTestClasses'
    classpath = sourceSets.auraTest.runtimeClasspath
    mainClass = 'net.skycore.client.module.misc.TestBridgeModuleTest'
}
tasks.named('check') { dependsOn 'testAuraClicks', 'testRockstarAura', 'testScaffold', 'testSlabPass', 'testFreezeClip', 'testTestBridge' }

loom {
    runs {
        client {
            client()
            runDir 'run'
            programArgs '--username', 'Player'
            vmArgs '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
        }
    }
}
